[project]
name = "pytest-mergify"
dynamic = ["version"]
description = "pytest plugin for Mergify Test Insights: flaky test detection, quarantine and test selection"
authors = [{ name = "Julien Danjou", email = "jd@mergify.com" }]
license = "GPL-3.0-only"
readme = "README.md"
keywords = [
    "pytest",
    "testing",
    "flaky",
    "flaky-tests",
    "quarantine",
    "test-selection",
    "ci",
    "continuous-integration",
    "opentelemetry",
    "mergify",
]
# No `License ::` classifier: PEP 639 forbids pairing one with the SPDX
# `license` expression above, and build backends now reject the combination.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

requires-python = ">=3.8"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-sdk>=1.29",
    "requests>=2",
    "pytest>=6.0.0",
    "pytest-timeout>=2.4.0",
]

[project.urls]
Homepage = "https://mergify.com"
Documentation = "https://docs.mergify.com/test-insights/test-frameworks/pytest/"
Source = "https://github.com/Mergifyio/pytest-mergify"
Issues = "https://github.com/Mergifyio/pytest-mergify/issues"
Changelog = "https://github.com/Mergifyio/pytest-mergify/releases"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "mypy>=1.13.0",
    "poethepoet>=0.30.0",
    "codespell==2.4.3; python_version >= '3.9'",
    "yamllint>=1.35.1",
    "anys>=0.3.1",
    "responses>=0.25.8",
    # https://github.com/pytest-dev/pytest-asyncio/issues/706#issuecomment-2082788963
    "pytest-asyncio>=0.24.0",
    "freezegun>=1.5.5",
    "pytest-xdist>=3.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[project.entry-points.pytest11]
pytest_mergify = "pytest_mergify"

[tool.hatch.version]
source = "vcs"
fallback-version = "0"


[tool.poe]
include = ["poe.toml"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["pytest_mergify", "tests"]
show_error_codes = true

[tool.ruff]
target-version = "py38"

[[tool.mypy.overrides]]
module = [
  "pytest_opentelemetry.*",
  "pytest_timeout.*",
  "requests"
]
ignore_missing_imports = true
